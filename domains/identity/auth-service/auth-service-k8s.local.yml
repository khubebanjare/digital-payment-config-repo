# Auth Service - Kubernetes Local Configuration
server:
  port: 8081
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 20000
    max-connections: 8192
    accept-count: 100

spring:
  cloud:
    vault:
      host: localhost
      port: 8200
      scheme: http
      token: hvs.IB7RvtNwphgLco9dZA3icKf7

      kv:
        enabled: true
        backend: kv
        default-context: credentials

  config:
    import:
      - optional:vault://

  kubernetes:
    discovery:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_k8s_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: AuthServiceHikariCP

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true

    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

logging:
  level:
    root: INFO
    com.digitalpayment.auth: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] [%X{service:-auth-service}] %logger{36} - %msg%n"

management:
  otlp:
    logging:
      endpoint: http://localhost:4318/v1/logs
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - env

  endpoint:
    health:
      show-details: always

    prometheus:
      enabled: true

  health:
    db:
      enabled: true

  tracing:
    enabled: true

    sampling:
      probability: 1.0

  observations:
    annotations:
      enabled: true

  metrics:
    tags:
      service: auth-service
      team: banking
      environment: k8s-local

  otel:
    service:
      name: auth-service
    logs:
      exporter: otlp
    exporter:
      otlp:
        protocol: http
        endpoint: http://localhost:4318
        logs:
          endpoint: http://localhost:4318/v1/logs

    metrics:
      export:
        url: http://localhost:4318/v1/metrics