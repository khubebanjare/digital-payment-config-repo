# Auth Service - Kubernetes Local Configuration
spring:
  kubernetes:
    discovery:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_k8s_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always