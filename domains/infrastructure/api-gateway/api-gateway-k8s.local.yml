# API Gateway - Kubernetes Local Configuration
spring:
  cloud:
    vault:
      host: localhost
      port: 8200
      scheme: http
      token: hvs.IB7RvtNwphgLco9dZA3icKf7

      kv:
        enabled: true
        backend: kv
        default-context: credentials

  config:
    import:
      - optional:vault://

    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

  data:
    redis:
      host: localhost
      port: 6379

  kubernetes:
    discovery:
      enabled: true
